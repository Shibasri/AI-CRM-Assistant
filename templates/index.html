<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CRM Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>AI CRM Assistant</h1>

        <p class="subtitle">
            Manage your CRM using natural language
        </p>

        <div id="chatbox" class="chatbox">

            <div class="message ai">
                <strong>AI:</strong>
                Hello! Ask me anything about your CRM.
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Ask about customers, deals or notes..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
